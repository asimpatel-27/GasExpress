
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | GasExpress</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px #00000015;
        }

        h1 {
            text-align: center;
            color: #0759b5;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #0759b5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #06458c;
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #0759b5;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GasExpress</h1>
        <p>Create your customer account</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>

        <div class="link">
            Already registered? <a href="/login/">Login</a>
        </div>

        <div class="link">
            <a href="/">Back to Home</a>
        </div>
    </div>
</body>
</html>
