
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - GasConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>GasConnect</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h1>Create Account</h1>
            <p>Register for GasConnect services</p>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" placeholder="Enter 10-digit mobile number"
                    pattern="[0-9]{10}" maxlength="10" required>

                <label for="address">Delivery Address</label>
                <input type="text" id="address" placeholder="Enter your address" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password"
                    minlength="8" required>

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage"></p>

            <p>Already registered? <a href="login.html">Login here</a></p>
        </div>
    </section>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("registerMessage").textContent =
                "Registration form submitted successfully! Backend setup is pending.";
        });
    </script>

</body>
</html>
