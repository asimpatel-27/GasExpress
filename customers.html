
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasConnect - Customer Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>GasConnect</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Booking</a>
            <a href="tracking.html">Tracking</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h1>Customer Management</h1>
            <p>Enter customer information.</p>

            <form id="customerForm">
                <label for="customerId">Customer ID</label>
                <input type="text" id="customerId" placeholder="Enter Customer ID" required>

                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" placeholder="Enter full name" required>

                <label for="customerEmail">Email</label>
                <input type="email" id="customerEmail" placeholder="Enter email address" required>

                <label for="customerPhone">Mobile Number</label>
                <input type="tel" id="customerPhone" placeholder="10-digit mobile number"
                    pattern="[0-9]{10}" maxlength="10" required>

                <label for="customerAddress">Delivery Address</label>
                <input type="text" id="customerAddress" placeholder="Enter delivery address" required>

                <button type="submit">Add Customer</button>
            </form>

            <p id="customerMessage"></p>
            <a href="dashboard.html" class="back-link">Back to Dashboard</a>
        </div>
    </section>

    <script>
        document.getElementById("customerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const id = document.getElementById("customerId").value;
            const name = document.getElementById("customerName").value;

            document.getElementById("customerMessage").textContent =
                "Demo customer added: " + id + " | " + name +
                ". Customer data is not saved to a database.";
        });
    </script>

</body>
</html>
