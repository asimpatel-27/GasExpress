
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Cylinder Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .message {
            padding: 10px;
            background: #e8f5e9;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gas Cylinder Booking</h1>
        <p>Book your gas cylinder online.</p>

        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <label for="customer_name">Customer Name</label>
            <input type="text" id="customer_name"
                   name="customer_name" required>

            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone"
                   name="phone" required>

            <label for="address">Delivery Address</label>
            <textarea id="address"
                      name="address" required></textarea>

            <label for="cylinder_type">Cylinder Type</label>
            <select id="cylinder_type" name="cylinder_type">
                <option value="Domestic">Domestic</option>
                <option value="Commercial">Commercial</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity"
                   name="quantity" min="1" max="10"
                   value="1" required>

            <button type="submit">Book Cylinder</button>
        </form>
    </div>
</body>
</html>
